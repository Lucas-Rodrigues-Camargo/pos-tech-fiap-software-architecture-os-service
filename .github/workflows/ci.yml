name: Validate Orders Service
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Tests.csproj
      - run: dotnet build tests/Tests.csproj -c Release --no-restore
      - run: dotnet test tests/Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-os
          path: tests/TestResults/**/coverage.cobertura.xml
      - run: docker build -t oficina-os:ci .

