name: Provision infrastructure
on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 'Optional provisioning of NEW resources; not needed with existing infrastructure'
        type: boolean
        default: false
permissions: { contents: read, id-token: write }
concurrency:
  group: terraform-os
  cancel-in-progress: false
jobs:
  terraform:
    if: vars.INFRA_ENABLED == 'true' && inputs.confirm_apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: |
          umask 077
          printf '%s' "$TF_VARS_JSON" > "$RUNNER_TEMP/input.tfvars.json"
          terraform -chdir=infra init -backend-config="bucket=$STATE_BUCKET" -backend-config="key=phase4/os/terraform.tfstate" -backend-config="region=$REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=infra plan -var-file="$RUNNER_TEMP/input.tfvars.json" -out="$RUNNER_TEMP/plan"
          terraform -chdir=infra apply "$RUNNER_TEMP/plan"
